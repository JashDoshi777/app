<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIFTY OI Tracker — Live</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=13">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#0c0e14;color:#e8eaed;min-height:100vh;font-size:13px}
        .toolbar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:#141620;border-bottom:1px solid rgba(255,255,255,0.06);flex-wrap:wrap;gap:8px}
        .toolbar-left,.toolbar-center,.toolbar-right{display:flex;align-items:center;gap:12px}
        .tab-nav{display:flex;background:#141620;border-bottom:1px solid rgba(255,255,255,0.06);padding:0 16px}
        .tab-panel{display:none}.tab-panel.active{display:block}
        /* Historical date picker */
        .historical-controls{display:none;align-items:center;gap:8px;margin-left:8px}
        .historical-controls.show{display:flex}
        .historical-controls input[type="date"]{
            background:#1a1d2e;color:#e8eaed;border:1px solid rgba(255,255,255,0.1);
            padding:4px 8px;border-radius:4px;font-family:'Inter',sans-serif;font-size:12px;
        }
        .historical-controls select{
            background:#1a1d2e;color:#e8eaed;border:1px solid rgba(255,255,255,0.1);
            padding:4px 8px;border-radius:4px;font-family:'Inter',sans-serif;font-size:12px;
        }
        .historical-controls button{
            background:#42a5f5;color:#fff;border:none;padding:4px 12px;
            border-radius:4px;font-size:12px;cursor:pointer;font-weight:600;
        }
    </style>
    <!-- Chart.js for OI/PCR charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <!-- Lightweight Charts by TradingView for real candlestick -->
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

<!-- ═══ HEADER / TOOLBAR ═══ -->
<header class="toolbar">
    <div class="toolbar-left">
        <div class="logo">
            <span class="logo-icon">50</span>
            <span class="logo-text">NIFTY</span>
        </div>
        <div class="expiry-badge" id="expiry-badge">--</div>
    </div>

    <div class="toolbar-center">
        <div class="tf-group">
            <button class="tf-btn active" data-tf="1">1m</button>
            <button class="tf-btn" data-tf="3">3m</button>
            <button class="tf-btn" data-tf="5">5m</button>
            <button class="tf-btn" data-tf="10">10m</button>
            <button class="tf-btn" data-tf="15">15m</button>
            <button class="tf-btn" data-tf="30">30m</button>
        </div>
        <div class="mode-toggle">
            <button class="mode-btn active" data-mode="live" id="btn-live">Live</button>
            <button class="mode-btn" data-mode="historical" id="btn-historical">Historical</button>
        </div>
        <div class="historical-controls" id="historical-controls">
            <select id="historical-date">
                <option value="">Select Date</option>
            </select>
            <button id="load-historical-btn">Load</button>
        </div>
    </div>

    <div class="toolbar-right">
        <div class="live-indicator" id="live-dot">
            <span class="dot"></span>
            <span class="live-time" id="live-time">--:--:--</span>
        </div>
        <span class="market-badge" id="market-badge">CLOSED</span>
    </div>
</header>



<!-- ═══ TAB 1: OI DATA TABLE ═══ -->
<section class="tab-panel active" id="panel-oi-table">
    <div class="table-header-bar">
        <div class="table-info">
            <span class="underlying-price" id="underlying-price">--</span>
            <span class="table-label">NIFTY Spot</span>
        </div>
        <div class="table-filters">
            <!-- Auto ATM / Fixed toggle (matches StockMojo) -->
            <div class="atm-mode-toggle">
                <span class="filter-label-text">Mode</span>
                <div class="tf-group" id="atm-mode-group">
                    <button class="atm-btn active" data-atm-mode="auto">Auto ATM</button>
                    <button class="atm-btn" data-atm-mode="fixed">Fixed</button>
                </div>
            </div>
            <!-- Range selector with display -->
            <label class="filter-label">± Range
                <select id="strike-range">
                    <option value="0">All</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5" selected>5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="10">10</option>
                    <option value="15">15</option>
                    <option value="20">20</option>
                </select>
            </label>
            <span class="range-display" id="range-display">--</span>
            <!-- Display mode buttons (matches StockMojo) -->
            <div class="display-mode-toggle" id="display-mode-group">
                <button class="display-btn active" data-display="total">Total OI</button>
                <button class="display-btn" data-display="change">OI Change (Day)</button>
                <button class="display-btn" data-display="all">All</button>
            </div>
                <button class="download-btn" id="download-csv-btn" title="Download CSV">⬇ CSV</button>
        </div>
    </div>
    <div class="table-container">
        <table class="oi-table" id="oi-data-table">
            <thead id="oi-table-head">
                <!-- Table header is dynamically rendered by JS based on display mode -->
            </thead>
            <tbody id="oi-table-body">
                <tr><td colspan="9" class="empty-msg">Waiting for market data...</td></tr>
            </tbody>
        </table>
    </div>
</section>



<script src="/static/js/app.js?v=17"></script>
</body>
</html>
